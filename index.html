<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MQTT Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            text-align: center;
            padding: 20px;
        }
        #data {
            font-size: 24px;
            margin-top: 20px;
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <h1>MQTT Dashboard</h1>
    <div id="data">Waiting for MQTT data...</div>

    <script src="https://unpkg.com/paho-mqtt/mqttws31.min.js"></script>
    <script>
        // Konfigurasi koneksi MQTT
        const client = new Paho.MQTT.Client('broker.hivemq.com', 8000, 'clientId-' + Math.random());

        // Fungsi ketika berhasil terkoneksi
        function onConnect() {
            console.log("Connected to broker");
            client.subscribe('myTopic');  // Ganti 'myTopic' dengan topik MQTT yang ingin kamu dengarkan
        }

        // Fungsi ketika pesan diterima
        function onMessageArrived(message) {
            console.log("Message arrived: " + message.payloadString);
            document.getElementById("data").innerHTML = "MQTT Data: " + message.payloadString;
        }

        // Fungsi ketika koneksi terputus
        function onConnectionLost(responseObject) {
            if (responseObject.errorCode !== 0) {
                console.log("Connection lost: " + responseObject.errorMessage);
            }
        }

        // Menghubungkan event handler dengan client
        client.onMessageArrived = onMessageArrived;
        client.onConnectionLost = onConnectionLost;

        // Koneksi ke broker
        client.connect({ onSuccess: onConnect });
    </script>
</body>
</html>
